worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Temp directories relocated to /tmp for AWS Lambda read-only root compliance
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Disable gzip compression:
    # Lambda Runtime API transmits JSON payloads. When Nginx gzips CSS/JS,
    # the binary compressed stream causes decoding errors (ERR_CONTENT_DECODING_FAILED)
    # in browsers behind Lambda Web Adapter / API Gateway.
    gzip off;

    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health Check (Readiness probe for AWS Lambda Web Adapter & Docker)
        location /healthz {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Static Assets (handles /css/styles.css as well as stage prefixes like /prod/css/styles.css)
        location ~* /(css|js|vendor)/(.*)$ {
            alias /usr/share/nginx/html/$1/$2;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # SPA / Main Entry Route (handles root and any stage prefix)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Error Pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
